# ingress frontend, point d'entrée unique
# ingress vs nodeport : routing l7, tls natif, un seul port 80/443
# nodeport expose le nœud directement sur un port aléatoire, moins propre en prod
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vitalsync-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: vitalsync.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vitalsync-frontend-svc
                port:
                  number: 80
          # api vers le backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: vitalsync-backend-svc
                port:
                  number: 3000
