# service clusterip backend, accès interne uniquement
# clusterip : le backend n'est pas exposé à l'extérieur, seulement via l'ingress
apiVersion: v1
kind: Service
metadata:
  name: vitalsync-backend-svc
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: vitalsync-backend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
